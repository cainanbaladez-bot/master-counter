name: Atualizar dados

# Só coleta e commita os dados. Quem publica a página é o "Publicar painel",
# disparado ao fim deste workflow.
#
# ATENÇÃO — o cron está desligado de propósito: em 13/09/2026 descobrimos que o
# portal do STF responde 403 a todo IP de datacenter, então este runner não
# consegue raspar (a API de partes passa, as abas aba*.asp não). A coleta de
# verdade roda na máquina do Cainan por coletar_e_publicar.cmd + Tarefa Agendada.
# Este workflow fica só para teste manual; as travas do pipeline impedem que uma
# coleta bloqueada publique um painel vazio.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # grupo versionado: um run fantasma preso em "queued" trava o grupo inteiro
  # (aconteceu em 12/09/2026 e nem o cron rodava). Basta versionar para escapar.
  group: coleta-v2
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cache das peças já baixadas
        uses: actions/cache@v4
        with:
          path: dados/pecas
          key: pecas-${{ github.run_id }}
          restore-keys: pecas-

      - name: Coletar do portal do STF
        run: python pipeline/coletar.py

      - name: Montar dados do painel
        run: python pipeline/montar_dados.py

      - name: Ler as peças e contar nomes citados
        run: python pipeline/analisar_conteudo.py

      - name: Montar visão de nomes e levas
        run: python pipeline/montar_mencoes.py

      - name: Commitar atualização
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json docs/mencoes.json dados/historico.jsonl dados/pecas_vistas.json
          git diff --staged --quiet || git commit -m "dados: coleta automática $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
