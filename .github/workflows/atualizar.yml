name: Atualizar dados e publicar painel

on:
  schedule:
    - cron: "0 9,21 * * *"   # 06h e 18h de Brasília
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pipeline/**"
      - "config/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar do portal do STF
        run: python pipeline/coletar.py

      - name: Montar dados do painel
        run: python pipeline/montar_dados.py

      - name: Commitar atualização
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json dados/historico.jsonl
          git diff --staged --quiet || git commit -m "dados: coleta automática $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
